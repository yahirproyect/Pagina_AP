<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PC Arm | Arma tu próxima PC</title>
<link rel="icon" type="image/png" href="media/favicon-pc-arm.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#0c1710;color:#f4f8ee;font:16px Geist,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid #c5fa65;outline-offset:5px}
.top-link{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;border:1px solid #4b674a;border-radius:9px;color:#c5fa65;font-size:13px;font-weight:700;transition:background .15s}
.top-link:hover{background:#263b2d}
.shell{width:min(1272px,calc(100% - 100px));margin:auto}
header{border-bottom:1px solid #26372b}
.nav{min-height:103px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{display:inline-flex;align-items:center;flex-shrink:0;line-height:0}
.brand-logo{display:block;width:215px;height:auto;background:transparent;filter:brightness(1.45) saturate(1.07) drop-shadow(0 2px 3px rgba(0,0,0,.20))}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;background:#c5fa65;color:#132016;font:700 20px "Space Mono",monospace}
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:calc(100svh - 104px);display:flex;align-items:center;background:#101e17}
.art{position:absolute;inset:0 0 0 33%;z-index:-2;background:#09160f url("media/portada-poster.jpg") center right/cover no-repeat}
.hero-video{display:block;width:100%;height:100%;object-fit:cover;object-position:center center;pointer-events:none}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#101e17 28%,#101e17e6 41%,#101e1700 70%)}
.copy{padding:75px 0 95px}
.kicker{color:#c5fa65;text-transform:uppercase;letter-spacing:.14em;font:700 12px "Space Mono",monospace}
h1{font-size:clamp(56px,8.5vw,122px);line-height:.94;letter-spacing:-.08em;margin:22px 0;max-width:780px}
h1 span{display:block;color:#c5fa65}
p{max-width:390px;margin:0 0 30px;color:#ccd9ce;line-height:1.6}
.cta{display:inline-flex;gap:28px;align-items:center;padding:15px 20px;border-radius:9px;background:#c5fa65;color:#182617;font-weight:800}
.cta:hover{background:#dcff9c}
@media(max-width:750px){
.shell{width:calc(100% - 40px)}
.nav{min-height:76px;gap:12px}
.top-link{font-size:11px;padding:9px 10px}
.brand-logo{width:152px}
.hero{min-height:calc(100svh - 77px);align-items:end}
.art{inset:0 0 28%;background-position:center}
.hero-video{object-position:54% center}
.hero::before{background:linear-gradient(0deg,#101e17 18%,#101e17fa 31%,#101e1720 68%,transparent)}
.copy{padding:255px 0 44px}
h1{font-size:clamp(49px,10.8vw,78px)}
}
@media(prefers-reduced-motion:reduce){.hero-video{display:none}}
</style>
</head>
<body>
<header><div class="shell nav"><a class="brand" href="index.html" aria-label="PC Arm, página de inicio"><img class="brand-logo" src="media/logo-pc-arm.png" width="772" height="339" alt="PC Arm — Arma tu PC, compara y revisa su rendimiento"></a><a class="top-link" href="configurador.html">Abrir configurador <span aria-hidden="true">→</span></a></div></header>
<main class="hero">
  <div class="art" aria-hidden="true">
    <video class="hero-video" autoplay muted loop playsinline preload="metadata" poster="media/portada-poster.jpg" tabindex="-1">
      <source src="media/pc-arm-fondo.mp4" type="video/mp4">
    </video>
  </div>
  <div class="shell copy">
    <div class="kicker">Configurador de computadoras</div>
    <h1>Arma tu PC<span>pieza por pieza.</span></h1>
    <p>Elige los componentes de tu próxima computadora, comprueba la compatibilidad y estima su rendimiento antes de comprar.</p>
    <a class="cta" href="configurador.html">Armar mi PC <span aria-hidden="true">→</span></a>
  </div>
</main>
</body>
</html>
